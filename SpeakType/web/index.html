<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SpeakType</title>
    <link rel="stylesheet" href="/assets/styles.css?v=4" />
  </head>
  <body>
    <main id="overlay" class="overlay state-idle">
      <header class="toolbar">
        <div id="drag-handle" class="drag-handle" title="按住拖动，不改变输入焦点" data-i18n-title="按住拖动，不改变输入焦点">
          <span class="grip" aria-hidden="true">⠿</span>
          <span id="status-dot" class="status-dot" aria-hidden="true"></span>
          <span id="state-label" class="state-label" data-i18n="准备就绪">准备就绪</span>
          <span id="model-name" class="model-name">SpeakType</span>
        </div>
        <div class="window-actions">
          <button id="compact-button" type="button" aria-label="收起悬浮窗，继续听写" title="收起，听写继续运行" aria-expanded="true" data-i18n-aria-label="收起悬浮窗，继续听写" data-i18n-title="收起，听写继续运行">−</button>
          <button id="close-button" type="button" aria-label="退出听写" title="退出听写，取消未完成的识别" data-i18n-aria-label="退出听写" data-i18n-title="退出听写，取消未完成的识别">×</button>
        </div>
      </header>
      <section class="speech-panel">
        <div id="transcript" class="transcript placeholder" role="status" data-i18n="按快捷键开始听写">按快捷键开始听写</div>
        <canvas id="waveform" width="360" height="28" aria-label="麦克风音量" data-i18n-aria-label="麦克风音量"></canvas>
      </section>
      <footer class="meta-row">
        <span id="notice" data-i18n="准备就绪">准备就绪</span>
        <span class="latency" title="识别服务报告的首字响应时间" data-i18n-title="识别服务报告的首字响应时间"><span id="latency-value">—</span> ms</span>
        <span id="connection" class="connection" data-i18n="正在连接">正在连接</span>
      </footer>
      <span id="mode-badge" hidden data-i18n="本地听写">本地听写</span>
    </main>
    <script type="module" src="/assets/app.js?v=4"></script>
  </body>
</html>
