<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>人物与中文口型验证 · Aixora Audio</title>
  <link rel="icon" href="/workbench-static/aixora-audio-logo.png" />
  <link rel="stylesheet" href="avatar/preview.css" />
  <script type="importmap">{"imports":{"three":"./avatar/vendor/three/build/three.module.js","three/addons/":"./avatar/vendor/three/examples/jsm/"}}</script>
</head>
<body>
  <header><a href="../#realtime">← 工作台</a><strong>人物与中文口型验证</strong><a href="./?avatar=1">进入实时聊天</a></header>
  <main>
    <section id="character" aria-label="写实半身人物"><p id="character-status">正在加载人物…</p></section>
    <section class="controls">
      <div class="title"><span class="eyebrow">AIXORA AUDIO</span><h1>声音，让人物动起来</h1><p>先观察人物质感、中文口型和自然动作。</p></div>
      <label>本地声音模型<select id="tts-model" disabled><option>读取当前模型…</option></select></label>
      <label id="voice-field" hidden>声音<select id="tts-voice"></select></label>
      <label>中文测试文本<textarea id="test-text" rows="4" maxlength="240">你好，欢迎回来。我们慢慢聊。爸爸妈妈，白猫跑步；一二三四五，今天的心情怎么样？</textarea></label>
      <div class="actions"><button id="generate" disabled>生成并播放</button><button id="replay" disabled class="secondary">重播</button><button id="stop" class="secondary" disabled>停止播放</button></div>
      <p id="status" role="status" aria-live="polite">正在检查本地 TTS…</p>
      <div class="options"><label><input id="natural-motion" type="checkbox" checked />眨眼与头部动作</label><label>音画补偿 <input id="lip-delay" type="range" min="0" max="180" step="10" value="90" /><output id="delay-value">90 ms</output></label></div>
      <div class="metrics"><span id="fps">— FPS</span><span id="viseme">等待声音</span><span id="model-size">单个人物 · 素净背景</span></div>
      <details><summary>使用已有的 TTS 音频</summary><input id="audio-file" type="file" accept="audio/*" /><p>口型为实时音频识别结果，中文准确度需目测判断。</p></details>
    </section>
  </main>
  <script type="module" src="avatar/preview.js"></script>
</body>
</html>
